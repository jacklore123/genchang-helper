name: 构建电脑版与安卓版

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install numpy onnxruntime soundfile imageio-ffmpeg pyinstaller pillow
      - name: 拉取模型
        run: python tools/fetch_model.py
      - name: 打包 exe
        run: python tools/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: 跟唱助手-windows
          path: dist/跟唱助手/
          retention-days: 30

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3
      - name: 安装 SDK 组件
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: 安装 Python 依赖
        run: pip install pillow
      - name: 打包 APK
        env:
          ANDROID_SDK: ${{ env.ANDROID_HOME }}
          GENCHANG_WORK: ${{ runner.temp }}/gcbuild
        run: python tools/build_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: 跟唱助手-android
          path: 发布/*.apk
          retention-days: 30
